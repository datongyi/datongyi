name: Update contribution art

on:
  schedule:
    - cron: '23 2 * * *' # Daily at 10:23 Asia/Shanghai.
  workflow_dispatch:

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the profile
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main

      - name: Generate the contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: datongyi
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/contributions/github-snake.svg?color_snake=#A67934&color_dots=#EDF1EA,#CDECE0,#88D7BD,#4BA58E,#267F6E
            assets/contributions/github-snake-dark.svg?palette=github-dark&color_snake=#F0DBA6&color_dots=#1C3540,#244C50,#346F68,#4B9D8C,#78DEC6

      - name: Generate the 3D contribution calendars
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: datongyi

      - name: Commit updated contribution art
        shell: bash
        run: |
          git add -- assets/contributions/ profile-3d-contrib/
          if git diff --cached --quiet; then
            echo 'Contribution art is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update contribution art'
          git push origin HEAD:main
